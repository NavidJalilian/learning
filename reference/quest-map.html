<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>System Design Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ee; --bg-2: #ece8df; --panel: #ffffff; --ink: #1c1a26; --muted: #6a6778; --line: #e2ddd2;
  --accent: #5a48f0; --accent-soft: #ebe8ff; --teal: #0d9a96; --good: #1d9a52; --good-soft: #e1f6e9; --xp: #f0b400;
  --shadow: 0 1px 2px rgba(20,16,40,.05), 0 10px 30px rgba(40,30,90,.07);
  --font: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0f1d; --bg-2: #15172b; --panel: #181a30; --ink: #ecebf6; --muted: #9a98b4; --line: #2a2d4a;
  --accent: #8f82ff; --accent-soft: #25224a; --teal: #31d3c8; --good: #43d98a; --good-soft: #12301f; --xp: #ffd23f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); } }
:root[data-theme="dark"] {
  --bg: #0e0f1d; --bg-2: #15172b; --panel: #181a30; --ink: #ecebf6; --muted: #9a98b4; --line: #2a2d4a;
  --accent: #8f82ff; --accent-soft: #25224a; --teal: #31d3c8; --good: #43d98a; --good-soft: #12301f; --xp: #ffd23f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
main { max-width: 860px; margin: 0 auto; padding: 36px 16px 80px; }
a { color: inherit; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font-size: clamp(34px, 7vw, 52px); line-height: 1; margin: 8px 0 12px; letter-spacing: -.02em; }
.lede { color: var(--muted); font-size: 18px; margin: 0; max-width: 600px; }
.player { margin-top: 24px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow); }
.avatar { width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--teal)); display: grid; place-items: center; font-size: 28px; }
.rank { font-weight: 700; font-size: 20px; }
.xpline { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 600; margin: 4px 0; }
.xpbar { height: 10px; border-radius: 99px; background: var(--bg-2); overflow: hidden; border: 1px solid var(--line); }
.xpbar div { height: 100%; background: linear-gradient(90deg, var(--xp), #ff9f1c); width: 0; transition: width .8s; }
h2 { font-size: 22px; margin: 40px 0 6px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.path { position: relative; display: grid; gap: 14px; padding-left: 34px; }
.path::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 4px; border-radius: 4px; background: var(--line); }
.q { position: relative; display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; text-decoration: none; box-shadow: var(--shadow); transition: transform .15s, border-color .2s; }
a.q:hover { transform: translateX(4px); border-color: var(--accent); }
.q::before { content: ""; position: absolute; left: -27px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: var(--line); border: 4px solid var(--bg); }
.q.open::before { background: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); }
.q.done::before { background: var(--good); }
.q.lockd { opacity: .55; box-shadow: none; }
.q .id { font-family: var(--mono); font-size: 13px; color: var(--muted); width: 34px; flex: none; }
.q .body { flex: 1; min-width: 0; }
.q b { display: block; font-size: 16px; }
.q span.d { font-size: 13.5px; color: var(--muted); }
.q .st { font-size: 13px; font-weight: 700; white-space: nowrap; }
.q.open .st { color: var(--accent); }
.q.done .st { color: var(--good); }
.q.boss { background: linear-gradient(160deg, var(--accent-soft), var(--panel)); }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.ch { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.ch .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ch.here { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ch.lockd { opacity: .55; }
.links { margin-top: 36px; display: flex; gap: 10px; flex-wrap: wrap; }
.links a { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; text-decoration: none; }
.links a:hover { border-color: var(--accent); }
@media (max-width: 520px) { .q .st { display: none; } }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 0; }
.jump a { font: 600 12.5px var(--mono); text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 10px; min-height: 30px; display: inline-flex; align-items: center; gap: 5px; }
.jump a.done { border-color: var(--good); color: var(--good); }
.jump a.soon { opacity: .5; }
.world { margin-top: 26px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 22px; padding: 4px 16px 4px; scroll-margin-top: 16px; }
.world > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding: 14px 2px; }
.world > summary::-webkit-details-marker { display: none; }
.world .wk { font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.world .wt { font-size: 20px; font-weight: 700; line-height: 1.2; grid-column: 1; }
.world .wn { font-size: 14px; color: var(--muted); grid-column: 1; }
.world .wp { grid-column: 2; grid-row: 1 / span 3; text-align: right; font-weight: 700; font-size: 14px; white-space: nowrap; }
.world .wp small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }
.world .wbar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--panel); overflow: hidden; }
.world .wbar div { height: 100%; background: var(--good); }
.world .chev { display: inline-block; transition: transform .2s; color: var(--muted); }
.world[open] .chev { transform: rotate(90deg); }
.world .path { margin: 4px 0 14px; }
.world .wlinks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.world .wlinks a { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13.5px; text-decoration: none; }
.world .wlinks a:hover { border-color: var(--accent); }
.world .empty { color: var(--muted); font-size: 14px; padding: 0 0 16px; }
@media (prefers-reduced-motion: reduce) { .world .chev, a.q, .xpbar div { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="kicker">Alex Xu · System Design Interview, Vol. 1</div>
  <h1>System Design Quest</h1>
  <p class="lede">Every chapter of the book as a world of playable quests. Everything is open — suggested order is top to bottom. Progress is saved in this browser.</p>

  <div class="player">
    <div class="avatar">🧑‍💻</div>
    <div>
      <div class="rank" id="rank">Intern</div>
      <div class="xpline"><span id="xpTotal">0 XP</span><span id="starTotal">★ 0</span></div>
      <div class="xpbar"><div id="xpBar"></div></div>
    </div>
  </div>

  <nav class="jump" id="jump" aria-label="Jump to a world"></nav>
  <div id="worlds"></div>

  <div class="links">
    <a href="https://bytebytego.com/courses/system-design-interview/scale-from-zero-to-millions-of-users" target="_blank" rel="noopener">📖 The book on ByteByteGo</a>
  </div>
</main>
<script src="../lessons/quest-engine.js"></script>
<script>
(() => {
  const QUESTS = Quest.CATALOG, WORLDS = Quest.WORLDS.slice().sort((a, b) => a.w - b.w);
  const d = Quest.load(), data = d.lessons;
  const xp = Quest.totalXP(d), stars = Object.values(data).reduce((s, l) => s + (l.stars || 0), 0);
  const r = Quest.rankOf(xp);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('rank').textContent = `Lv ${r.i + 1} · ${r.name}`;
  const ready = QUESTS.filter(q => q.ready), cleared = ready.filter(q => data[q.id]).length;
  document.getElementById('xpTotal').textContent = `${xp} XP · next rank at ${r.hi} · ${cleared}/${ready.length} quests`;
  document.getElementById('starTotal').textContent = `★ ${stars}`;
  requestAnimationFrame(() => document.getElementById('xpBar').style.width = Math.min(100, (xp - r.lo) / (r.hi - r.lo) * 100) + '%');

  // Which worlds are expanded is a per-browser convenience; default = the first world with an unfinished ready quest.
  let openSet = null;
  try { openSet = JSON.parse(localStorage.getItem('sdq:v1:map-open') || 'null'); } catch (_) {}
  const firstTodo = (WORLDS.find(w => QUESTS.some(q => q.w === w.w && q.ready && !data[q.id])) || WORLDS[0] || {}).w;
  if (!Array.isArray(openSet)) openSet = [firstTodo];
  if (location.hash && /^#w\d+$/.test(location.hash)) openSet.push(+location.hash.slice(2));

  const questRow = q => {
    const done = !!data[q.id], inRun = !!d.runs[q.id];
    const open = !done && q.ready && Quest.isUnlocked(d, q.id);
    const cls = done ? 'done' : open ? 'open' : 'lockd';
    const st = done ? '★'.repeat(data[q.id].stars || 1) + ' cleared · replay' : open ? (inRun ? '▶ continue' : '▶ play') : 'coming soon';
    const tag = q.ready && (done || open) ? 'a' : 'div';
    return `<${tag} class="q ${cls}${q.boss ? ' boss' : ''}"${tag === 'a' ? ` href="../lessons/${q.file}"` : ''}><span class="id">${esc(q.n)}</span><span class="body"><b>${esc(q.t)}</b><span class="d">${esc(q.d)}</span></span><span class="st">${st}</span></${tag}>`;
  };

  document.getElementById('worlds').innerHTML = WORLDS.map(w => {
    const qs = QUESTS.filter(q => q.w === w.w), rq = qs.filter(q => q.ready), dn = rq.filter(q => data[q.id]).length;
    const pct = rq.length ? Math.round(dn / rq.length * 100) : 0;
    const prog = rq.length ? `${dn}/${rq.length}<small>${dn === rq.length ? '🏆 world cleared' : 'quests cleared'}</small>` : `<small>coming soon</small>`;
    return `<details class="world" id="w${w.w}" data-w="${w.w}"${openSet.includes(w.w) ? ' open' : ''}>
      <summary><span class="wk"><span class="chev">▸</span> World ${w.w} · Chapter ${w.w}</span><span class="wt">${esc(w.t)}</span><span class="wn">${esc(w.name || '')}</span><span class="wp">${prog}</span><span class="wbar"><div style="width:${pct}%"></div></span></summary>
      ${qs.length ? `<div class="path">${qs.map(questRow).join('')}</div>` : '<p class="empty">Quests for this chapter are being built.</p>'}
      <div class="wlinks">${w.cheatsheet && rq.length ? `<a href="${esc(w.cheatsheet)}">📄 Chapter ${w.w} cheat sheet</a>` : ''}${w.slug ? `<a href="https://bytebytego.com/courses/system-design-interview/${esc(w.slug)}" target="_blank" rel="noopener">📖 Chapter ${w.w} (ByteByteGo)</a>` : ''}</div>
    </details>`;
  }).join('');

  document.getElementById('jump').innerHTML = WORLDS.map(w => {
    const rq = QUESTS.filter(q => q.w === w.w && q.ready), all = rq.length && rq.every(q => data[q.id]);
    return `<a href="#w${w.w}" class="${all ? 'done' : rq.length ? '' : 'soon'}" title="${esc(w.t)}">${all ? '✓' : ''}W${w.w}</a>`;
  }).join('');
  document.querySelectorAll('#jump a').forEach(a => a.addEventListener('click', () => { const el = document.querySelector(a.getAttribute('href')); if (el) el.open = true; }));
  document.querySelectorAll('.world').forEach(el => el.addEventListener('toggle', () => {
    const now = [...document.querySelectorAll('.world[open]')].map(x => +x.dataset.w);
    try { localStorage.setItem('sdq:v1:map-open', JSON.stringify(now)); } catch (_) {}
  }));
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>
</body>
</html>
